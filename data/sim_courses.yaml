# Course-level simulation for the "Course simulation" tab (web/sim.js).
#
# ALL ACTIVITIES ARE MOCK EXAMPLES. Each programme-year has one real course from its
# 2026 curriculum (data/kth_courses/curricula.csv, fetched by tools/fetch_kth_courses.py),
# chosen because it is mandatory or conditionally elective and its syllabus already has a
# LAB or PRO-type examination module (data/kth_courses/course_modules.csv). The makerspace
# activity attached to it is invented and only shows what such a course *might* do.
# Exceptions are noted per course (`pick_note`).
#
# Per course:
#   id          unique key (course code; add a suffix if one course appears twice)
#   code        KTH course code (name and exam modules are looked up at export time)
#   takers      programme-years taking the course, each with `share` of that cohort (0-1) or
#               `students` (head count). Participants = sum over takers, unless `students`
#               is given on the course itself. For now every course has one taker at 100%.
#   period      P1-P4 of 2027/28;  weeks: [first, last] teaching week of the makerspace phase
#   group_size  students per project group (1-10)
#   sup_h       supervised makerspace hours per group (4 h daytime sessions, whole section)
#   unsup_h     unsupervised hours per group (4 h evening/Saturday visits, <= 2 members each)
#   own         half-days the course holds in the timetable (TimeEdit, where known);
#               omitted -> `own_n` random half-days per seed (bachelor 2, master 3)
#   motif       illustration key in web/sim.js
#
# Thesis entries (kind: thesis) are not courses with sessions: each group needs `bench_h`
# makerspace hours over the thesis, split over `periods`, and books any free daytime
# half-day after the courses have been placed (evenings when the day is full). Their takers'
# shares (how many in each cohort do a thesis that uses the makerspace) are ASSUMPTIONS.

calendar:
  year: "2027/28"
  teaching_weeks: 7
  note: >-
    Period starts for 2027/28: HT27 teaching starts 2027-08-30 (kth.se curriculum data); the
    other starts are approximate. The board shows 7 teaching weeks per period and ignores
    single holidays (e.g. Easter 2028 falls in P4).
  periods:
    P1: {term: HT27, start: "2027-08-30"}
    P2: {term: HT27, start: "2027-11-01"}
    P3: {term: VT28, start: "2028-01-17"}
    P4: {term: VT28, start: "2028-03-20"}

rules:
  section_students: 24       # students per supervised section (whole groups)
  teachers_per_section: 1
  session_h: 4
  max_sessions_per_week: 2   # per section
  day_cap_persons: 62        # 3203 (50) + 3202 (8) + 3D studio (4)
  day_available: 0.765       # booking efficiency 0.85 x (1 - 0.10 other use), as in the model
  open_slots_per_week: 4     # staffed evenings: ~19.5 staffed h/week -> 4 x 4 h (Mon-Thu)
  open_cap_persons: 40       # 2 supervisors x 20 users
  visit_members: 2           # group members present per open-access visit (at most the group size)
  visit_h: 4
  own_n: {bachelor: 2, master: 3}

courses:
  # ---------------- P1 ----------------
  - id: SH1015
    code: SH1015
    takers: [{cohort: CTFYS-3, share: 1.0}]
    activity: "Build a radiation detector"
    period: P1
    weeks: [1, 7]
    group_size: 4
    sup_h: 12
    unsup_h: 8
    own_n: 3
    motif: detector
    text: >-
      One of the four labs becomes a larger project: build a detector, calibrate it with a
      check source, then go out and measure background radiation somewhere on campus.
    pick_note: "Suggested by the CTFYS programme director; SH1015 has PRO1 and LAB1."

  - id: SA1006
    code: SA1006
    takers: [{cohort: CTMAT-3, share: 1.0}]
    activity: "Design of experiments with a catapult"
    period: P1
    weeks: [2, 6]
    group_size: 4
    sup_h: 8
    unsup_h: 4
    motif: catapult
    text: >-
      One of the course's project modules uses a laser-cut catapult with adjustable arm, angle
      and tension as the test object for a factorial design, then hits a target in one shot.

  - id: SD2900
    code: SD2900
    takers: [{cohort: TAEEM-1, share: 1.0}]
    activity: "CubeSat structure mock-up"
    period: P1
    weeks: [2, 7]
    group_size: 5
    sup_h: 12
    unsup_h: 8
    motif: cubesat
    text: >-
      Teams design a 1U CubeSat frame, print and machine it, and check it against launch loads
      with a shaker test and a finite-element model.

  - id: SD2810
    code: SD2810
    takers: [{cohort: TAEEM-2, share: 1.0}]
    activity: "Flutter model for the wind tunnel"
    period: P1
    weeks: [2, 6]
    group_size: 4
    sup_h: 8
    unsup_h: 8
    motif: airfoil
    text: >-
      A printed wing section on a flexible mount is tuned to flutter inside the wind-tunnel
      speed range; groups compare the onset speed with their aeroelastic model.

  - id: SD2229
    code: SD2229
    takers: [{cohort: TFORM-2, share: 1.0}]
    activity: "Instrumented scale vehicle"
    period: P1
    weeks: [2, 7]
    group_size: 4
    sup_h: 8
    unsup_h: 8
    motif: car
    text: >-
      Groups add an IMU and wheel-speed sensors to a 1:10 vehicle and identify its handling
      from manoeuvres, compared with a bicycle model.

  - id: SD2111
    code: SD2111
    takers: [{cohort: TJVTM-2, share: 1.0}]
    activity: "Track vibration sensor"
    period: P1
    weeks: [3, 6]
    group_size: 3
    sup_h: 4
    unsup_h: 4
    motif: sensor
    text: >-
      Build a low-cost accelerometer node, deploy it next to a commuter line and estimate track
      condition from the vibration spectra.
    pick_note: "Conditionally elective with a LAB measurement module; railway is a TFORM track from HT26."

  - id: SD2165
    code: SD2165
    takers: [{cohort: TTEMM-1, share: 1.0}]
    activity: "Loudspeaker shaker and plate modes"
    period: P1
    weeks: [2, 6]
    group_size: 4
    sup_h: 8
    unsup_h: 4
    motif: beam
    text: >-
      Build a shaker from a loudspeaker and find mode shapes of cut plates with Chladni
      patterns and an accelerometer, compared with FE eigenmodes.

  - id: SF2529
    code: SF2529
    takers: [{cohort: TTMAM-2, share: 1.0}]
    activity: "Weather stations and an inverse problem"
    period: P1
    weeks: [3, 7]
    group_size: 3
    sup_h: 4
    unsup_h: 4
    motif: weather
    text: >-
      Build a few cheap sensor nodes, deploy them around campus and reconstruct a temperature
      field from sparse, noisy data.

  - id: SH2603
    code: SH2603
    takers: [{cohort: TNEEM-1, share: 1.0}]
    activity: "Printed shielding geometries"
    period: P1
    weeks: [3, 6]
    group_size: 3
    sup_h: 4
    unsup_h: 4
    motif: detector
    text: >-
      Print shield geometries filled with different materials and measure attenuation with a
      detector, compared with Monte Carlo transport results.

  # ---------------- P2 ----------------
  - id: SK1115
